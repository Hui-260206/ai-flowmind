name: flowmind-deploy

services:
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    environment:
      AI_ENV: ${AI_ENV:-production}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-info}
      AI_GRPC_LISTEN_ADDR: 0.0.0.0:50051
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-hy3}
      AI_PROVIDER_TIMEOUT: ${AI_PROVIDER_TIMEOUT:-12}
      MODEL_PROFILE: ${MODEL_PROFILE:-default}
    networks:
      - backend

  mysql:
    image: mysql:8.4.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flowmind_dev}
      MYSQL_USER: ${MYSQL_USER:-flowmind_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: ${MYSQL_TIMEZONE:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=${MYSQL_TIMEZONE_OFFSET:-+08:00}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -uroot
          -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli -h 127.0.0.1 -a "$${REDIS_PASSWORD}" --no-auth-warning
          ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  go-api:
    build:
      context: .
      dockerfile: go-api/Dockerfile
    restart: unless-stopped
    environment:
      GO_ENV: ${GO_ENV:-production}
      GO_HTTP_ADDR: :8080
      GO_LOG_LEVEL: ${GO_LOG_LEVEL:-info}
      GO_SHUTDOWN_TIMEOUT: ${GO_SHUTDOWN_TIMEOUT:-10s}
      GO_READ_HEADER_TIMEOUT: ${GO_READ_HEADER_TIMEOUT:-5s}
      GO_READ_TIMEOUT: ${GO_READ_TIMEOUT:-15s}
      GO_WRITE_TIMEOUT: ${GO_WRITE_TIMEOUT:-15s}
      GO_IDLE_TIMEOUT: ${GO_IDLE_TIMEOUT:-60s}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flowmind_dev}
      MYSQL_USER: ${MYSQL_USER:-flowmind_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_TIMEZONE: ${MYSQL_TIMEZONE:-Asia/Shanghai}
      MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-10}
      MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-5}
      MYSQL_CONN_MAX_LIFETIME: ${MYSQL_CONN_MAX_LIFETIME:-30m}
      MYSQL_CONN_MAX_IDLE_TIME: ${MYSQL_CONN_MAX_IDLE_TIME:-10m}
      REDIS_ADDR: redis:6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_IDEMPOTENCY_TTL: ${REDIS_IDEMPOTENCY_TTL:-48h}
      REDIS_SESSION_LOCK_TTL: ${REDIS_SESSION_LOCK_TTL:-30s}
      REDIS_OWNER_RATE_LIMIT_PER_MINUTE: ${REDIS_OWNER_RATE_LIMIT_PER_MINUTE:-20}
      AI_GRPC_ADDR: ai-service:50051
      AI_GRPC_TIMEOUT: ${AI_GRPC_TIMEOUT:-14s}
      AI_GRPC_KEEPALIVE_TIME: ${AI_GRPC_KEEPALIVE_TIME:-30s}
      AI_GRPC_KEEPALIVE_TIMEOUT: ${AI_GRPC_KEEPALIVE_TIMEOUT:-10s}
      AI_GRPC_MAX_MESSAGE_BYTES: ${AI_GRPC_MAX_MESSAGE_BYTES:-1048576}
      AI_PROVIDER_TIMEOUT: ${AI_PROVIDER_TIMEOUT:-12}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "${GO_HTTP_PORT:-8080}:8080"
    networks:
      - backend

volumes:
  mysql_data:
    name: flowmind_dev_mysql_data
  redis_data:
    name: flowmind_dev_redis_data

networks:
  backend:
    name: flowmind_dev_backend
    internal: true
