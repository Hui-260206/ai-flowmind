[project]
name = "flowmind-ai-service"
version = "0.1.0"
description = "Internal gRPC AI service for FlowMind"
requires-python = ">=3.12,<3.13"
dependencies = [
  "grpcio>=1.68,<2.0",
  "httpx>=0.28,<1.0",
  "protobuf>=5.29,<6.0",
  "pydantic-settings>=2.6,<3.0",
]

[dependency-groups]
dev = [
  "grpcio-tools>=1.68,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["gen"]

[tool.ruff.lint.per-file-ignores]
# main.py 必须先写入 sys.path 再导入依赖 ai.v1 生成代码的模块。
"app/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["gen/python", "."]
asyncio_mode = "auto"
