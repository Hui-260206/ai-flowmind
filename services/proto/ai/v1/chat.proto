syntax = "proto3";

package flowmind.ai.v1;

import "ai/v1/common.proto";

option go_package = "ai-flowmind/services/go-api/internal/grpcclient/pb;aiv1";

service ChatService {
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  rpc CompleteStream(CompleteStreamRequest) returns (stream CompleteStreamResponse);
}

message CompleteRequest {
  RequestContext context = 1;
  repeated ChatMessage messages = 2;
  int32 max_output_tokens = 3;
  double temperature = 4;
}

message CompleteResponse {
  ChatMessage message = 1;
  string model_name = 2;
  TokenUsage usage = 3;
  int64 latency_ms = 4;
}

message CompleteStreamRequest {
  RequestContext context = 1;
  repeated ChatMessage messages = 2;
  int32 max_output_tokens = 3;
  double temperature = 4;
}

message CompleteStreamResponse {
  ContentPart delta = 1;
  bool done = 2;
  string model_name = 3;
  TokenUsage usage = 4;
}
