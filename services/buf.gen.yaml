version: v2
plugins:
  # Concrete plugin versions and output paths are finalized with Go/Python
  # service initialization in stages 1.3 and 1.4.
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt:
      - paths=source_relative
  - local: python
    out: gen/python

