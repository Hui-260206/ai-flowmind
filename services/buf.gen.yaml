version: v2
plugins:
  # Go plugins are finalized in stage 1.10 (requires protoc-gen-go and
  # protoc-gen-go-grpc on PATH). Python stubs are generated separately with
  # `make proto-generate-python` (grpc_tools.protoc) into ai-service/gen/python,
  # because grpc_python_plugin is bundled with grpcio-tools and not exposed to buf.
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt:
      - paths=source_relative
