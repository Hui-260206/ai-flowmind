version: v2
plugins:
  # Go stubs are generated into the go-api module and imported as
  # ai-flowmind/services/go-api/internal/grpcclient/pb (package aiv1). The
  # module= option strips the module prefix so files land in
  # go-api/internal/grpcclient/pb. Python stubs use `make proto-generate-python`.
  - local: protoc-gen-go
    out: go-api
    opt:
      - module=ai-flowmind/services/go-api
  - local: protoc-gen-go-grpc
    out: go-api
    opt:
      - module=ai-flowmind/services/go-api
