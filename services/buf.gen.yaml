version: v2
plugins:
  # Go stub 生成到 go-api 模块，并以 ai-flowmind/services/go-api/internal/grpcclient/pb
  # （包名 aiv1）导入；module= 选项去掉模块前缀，使文件落到
  # go-api/internal/grpcclient/pb。Python stub 使用 `make proto-generate-python`。
  - local: protoc-gen-go
    out: go-api
    opt:
      - module=ai-flowmind/services/go-api
  - local: protoc-gen-go-grpc
    out: go-api
    opt:
      - module=ai-flowmind/services/go-api
