openapi: 3.0.3
info:
  title: FlowMind API
  version: 0.1.0
  description: Anonymous-device chat API. The Go API is the only public service.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Sessions
  - name: Messages
paths:
  /healthz:
    get:
      tags: [Health]
      responses:
        '200': { description: Process is alive }
  /readyz:
    get:
      tags: [Health]
      responses:
        '200': { description: Dependencies are ready }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      security: [{ clientId: [] }]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Session' }, example: { id: session_01J, title: 新会话, model_profile: default, created_at: '2026-08-08T12:00:00Z', updated_at: '2026-08-08T12:00:00Z' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Sessions]
      operationId: listSessions
      security: [{ clientId: [] }]
      responses:
        '200': { description: Sessions owned by this client, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Session' } } } } } } }
  /api/v1/sessions/{session_id}:
    parameters: [{ $ref: '#/components/parameters/SessionID' }]
    delete:
      tags: [Sessions]
      operationId: deleteSession
      security: [{ clientId: [] }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/sessions/{session_id}/messages:
    parameters: [{ $ref: '#/components/parameters/SessionID' }]
    get:
      tags: [Messages]
      operationId: listMessages
      security: [{ clientId: [] }]
      responses:
        '200': { description: Ordered messages, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Message' } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Messages]
      operationId: sendMessage
      security: [{ clientId: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
            example: { content: 介绍一下 Go, client_message_id: client-msg-001, model_profile: default }
      responses:
        '200': { description: User and assistant messages, content: { application/json: { schema: { $ref: '#/components/schemas/SendMessageResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/AIUnavailable' }
        '504': { $ref: '#/components/responses/AITimeout' }
components:
  securitySchemes:
    clientId: { type: apiKey, in: header, name: X-Client-ID, description: Anonymous device UUID; not an authentication credential. }
  parameters:
    SessionID: { name: session_id, in: path, required: true, schema: { type: string, minLength: 1 } }
  schemas:
    Session:
      type: object
      required: [id, title, model_profile, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        model_profile: { type: string, description: Server-owned model profile; never a provider or API key. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Message:
      type: object
      required: [id, role, content, status, created_at]
      properties:
        id: { type: string }
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string, maxLength: 32000 }
        status: { type: string, enum: [pending, completed, failed] }
        client_message_id: { type: string, maxLength: 128 }
        model_name: { type: string }
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    SendMessageRequest:
      type: object
      required: [content, client_message_id]
      properties:
        content: { type: string, minLength: 1, maxLength: 32000 }
        client_message_id: { type: string, minLength: 1, maxLength: 128 }
        model_profile: { type: string, default: default, maxLength: 64 }
    SendMessageResponse:
      type: object
      required: [request_id, user_message, assistant_message]
      properties:
        request_id: { type: string }
        user_message: { $ref: '#/components/schemas/Message' }
        assistant_message: { $ref: '#/components/schemas/Message' }
    ErrorResponse:
      type: object
      required: [request_id, error]
      properties:
        request_id: { type: string }
        error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { request_id: req_001, error: { code: INVALID_ARGUMENT, message: 消息不能为空 } } } } }
    NotFound: { description: Resource not found }
    Conflict: { description: Duplicate or concurrent request }
    RateLimited: { description: Rate limit exceeded }
    AIUnavailable: { description: AI service unavailable }
    AITimeout: { description: AI service timed out }
    ServiceUnavailable: { description: Dependency not ready }
